services:
  - type: web
    name: xiete
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIAL_SECRET
        sync: false
      - key: WECHAT_APPID
        sync: false
      - key: WECHAT_SECRET
        sync: false
      - key: MONITORING_HASH_SECRET
        sync: false
      - key: ADMIN_DASHBOARD_SECRET
        sync: false
      - key: REVIEW_DEMO_ENABLED
        sync: false
      - key: REVIEW_DEMO_USERNAME
        sync: false
      - key: REVIEW_DEMO_PASSWORD
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: TERM_CONFIG_MODE
        value: auto
